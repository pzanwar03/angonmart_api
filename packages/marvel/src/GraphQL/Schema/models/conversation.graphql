extend type Query {
    conversations(
        search: String
        orderBy: String
        sortedBy: String
    ): [Conversation]
        @paginate(
            builder: "Marvel\\GraphQL\\Queries\\ConversationQuery@fetchConversations"
            defaultCount: 15
        )
    conversation(id: ID @eq): Conversation @find
}

type Conversation {
    id: ID!
    user_id: ID!
    user: User @belongsTo
    unseen: Int
    latest_message: Message
    created_at: String
    updated_at: String
}

input CreateConversationInput {
    subject: String
}

extend type Mutation {
    createConversation(input: CreateConversationInput! @spread): Conversation
        @field(resolver: "ConversationMutator@store")
}
